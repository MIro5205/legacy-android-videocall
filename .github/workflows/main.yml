name: Build X10Call APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-10" "build-tools;23.0.3"

      - name: Create app icon
        run: |
          mkdir -p src/main/res/drawable
          python3 -c "
          import struct, zlib
          def chunk(name, data):
              c = name + data
              return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          sig = b'\x89PNG\r\n\x1a\n'
          ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', 48, 48, 8, 2, 0, 0, 0))
          raw = b''.join(b'\x00' + b'\x1a\x73\xe8' * 48 for _ in range(48))
          png = sig + ihdr + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          open('src/main/res/drawable/ic_launcher.png', 'wb').write(png)
          "

      - name: Fix layout compatibility
        run: |
          sed -i '/android:letterSpacing/d' src/main/res/layout/main.xml
          sed -i '/android:fillViewport/d' src/main/res/layout/main.xml

      - name: Install Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X10Call-APK
          path: build/outputs/apk/*.apk
          retention-days: 30
